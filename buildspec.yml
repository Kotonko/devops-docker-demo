version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo Installing dependencies and security scanning tools...
      - pip install --upgrade pip
      - pip install -r requirements.txt pytest safety bandit
  pre_build:
    commands:
      - echo Running security vulnerability scans...
      - safety check || true
      - bandit -r . || true
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 576134964248.dkr.ecr.us-east-1.amazonaws.com
      - REPOSITORY_URI=576134964248.dkr.ecr.us-east-1.amazonaws.com/devops-docker-demo
      - IMAGE_TAG=latest
  build:
    commands:
      - echo Running unit and integration tests...
      - pytest
      - echo Building multi-stage Docker image...
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
  post_build:
    commands:
      - echo Pushing image to Amazon ECR registry...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Build and deployment sequence completed successfully.

artifacts:
  files:
    - imagedefinitions.json
    - buildspec.yml
    - Dockerfile
